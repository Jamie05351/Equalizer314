name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dsp-backend-selector
      - jamesdsp-backend-adapter

jobs:
  build:
    name: Assemble debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug
